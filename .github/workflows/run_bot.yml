name: GCHAM Auto-Post Engine

on:
  schedule:
    # ⏰ Runs 10 times a day (roughly every 2.4 hours)
    - cron: '0 0,3,5,8,10,13,15,18,20,23 * * *'
  workflow_dispatch: # Manual "Run" button for Juma

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # --- 🛡️ HUMAN-LIKE DELAY ---
      - name: Random Delay (1-30 mins)
        run: |
          DELAY=$(( ( RANDOM % 30 ) + 1 ))
          echo "Waiting for $DELAY minutes before posting to GCHAM..."
          sleep $(( DELAY * 60 ))

      # --- 📦 DEPENDENCY INSTALLATION ---
      # Added 'ccxt' to the list below to fix the ModuleNotFoundError
      - name: Install Tools (FORCED)
        run: |
          python -m pip install --upgrade pip
          pip install groq tavily-python python-wordpress-xmlrpc google-api-python-client google-auth requests python-slugify feedparser Pillow tenacity oauth2client httplib2 ccxt

      # --- 🚀 RUN GCHAM ENGINE ---
      - name: Run GCHAM Bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASS: ${{ secrets.WP_PASS }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python bot.py

name: GCHAM Auto-Post Engine

on:
  schedule:
    - cron: '0 11,23 * * *'  # Morning (11am) and Evening (11pm) EAT/USA cycles
  workflow_dispatch:        # Manual "Run" button for the Chief Editor

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Tools (FORCED)
        run: |
          python -m pip install --upgrade pip
          pip install groq python-wordpress-xmlrpc google-api-python-client google-auth requests python-slugify feedparser Pillow tenacity

      - name: Run GCHAM Bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASS: ${{ secrets.WP_PASS }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python bot.py
